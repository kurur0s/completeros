        <!-- Pestaña histórica -->

    <div id="modalNotice" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-untappd-card border border-untappd-accent/40 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">

            <h3 class="text-lg font-bold text-white mb-1">Registro Guardado!</h3>

    </div>

    <script>
        // DEFAULT FALLBACK DATA GOES HERE, BECAUSE REASONS
        const DEFAULT_FRIENDS = ["Josefina", "Lucas", "Marcela", "Ximena"];

        const DEFAULT_VENUES = [
            {
                id: "v1",
                name: "Elkika Ilmenau",
                address: "Diego de Velásquez 2109, Providencia",
                date: "2026-05-14",
                components: ["Pan", "Salchicha", "Mayonesa"],
                extras: ["Palta", "Chucrut", "Tomate", "Salsa Verde", "Americana"]
            },
            {
                id: "v2",
                name: "Fuente Suiza",
                address: "Av. Irarrázaval 3361, Ñuñoa",
                date: "2026-06-22",
                components: ["Pan", "Salchicha", "Mayonesa"],
                extras: ["Palta", "Chucrut", "Tomate", "Salsa Verde", "Americana"]
            },
            {
                id: "v3",
                name: "La Predilecta",
                address: "Los Tres Antonios 397, Ñuñoa",
                date: "2026-11-19",
                components: ["Pan", "Salchicha", "Mayonesa"],
                extras: ["Palta", "Chucrut", "Tomate", "Salsa Verde", "Americana"]
            }
        ];

        // STORAGE KEYS & FIREBASE ENV VARS
        const STORAGE_CHECKINS_KEY = 'completerosCheckIns_v1';
        const STORAGE_VENUES_KEY = 'completerosVenues_v1';

        const appId = typeof __app_id !== 'undefined' ? __app_id : '1:1094417459923:web:01412cde5497b70b3a8226';
        let db = null;
        let auth = null;
        let currentUser = null;

        let venues = [];
        let friends = DEFAULT_FRIENDS;
        let checkins = [];
        let activeVenueId = null;
        let selectedExtras = new Set();

        const venueSelect = document.getElementById('venueSelect');
        const userSelect = document.getElementById('userSelect');
        const venueAddress = document.getElementById('venueAddress');
        const venueDate = document.getElementById('venueDate');
        const overallScore = document.getElementById('overallScore');
        const overallScoreDisplay = document.getElementById('overallScoreDisplay');
        const componentsContainer = document.getElementById('componentsContainer');
        const extrasContainer = document.getElementById('extrasContainer');
        const checkinForm = document.getElementById('checkinForm');
        const historyFeed = document.getElementById('historyFeed');
        const checkinCountBadge = document.getElementById('checkinCountBadge');
        const syncStatus = document.getElementById('syncStatus');
        const syncText = document.getElementById('syncText');
        const editingCheckinId = document.getElementById('editingCheckinId');
        const editingBanner = document.getElementById('editingBanner');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const submitBtn = document.getElementById('submitBtn');

        window.addEventListener('DOMContentLoaded', async () => {
            loadLocalData();
            populateFriends();
            populateVenues();
            setupTabNavigation();
            setupEventListeners();
            renderHistoryFeed();
            
            // Initialize Cloud Sync with Firebase
            initFirebase();
        });

        // INIT Firebase?
        async function initFirebase() {
            if (typeof __firebase_config === 'undefined' || !window.firebaseModules) {
                syncStatus.className = "inline-block w-2 h-2 rounded-full bg-gray-500";
                syncText.textContent = "Offline (Local Storage)";
                return;
            }

            try {
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, onSnapshot } = window.firebaseModules;
                /*const firebaseConfig = JSON.parse(__firebase_config);*/
                const firebaseConfig = {
                    apiKey: "AIzaSyCLUkvi5DHcVjBNL7tzUgxKXF-s0Xks7g8",
                    authDomain: "completeros.firebaseapp.com",
                    projectId: "completeros",
                    storageBucket: "completeros.firebasestorage.app",
                    messagingSenderId: "1094417459923",
                    appId: "1:1094417459923:web:01412cde5497b70b3a8226",
                    measurementId: "G-9VW4GCY6DG"
};
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Auth
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        syncStatus.className = "inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse";
                        syncText.textContent = "Live Cloud Synced";

                        // Listen to real-time public check-ins
                        const publicCheckinsRef = collection(db, 'artifacts', appId, 'public', 'data', 'checkins');
                        onSnapshot(publicCheckinsRef, (snapshot) => {
                            const cloudCheckins = [];
                            snapshot.forEach(docSnap => {
                                cloudCheckins.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            
                            if (cloudCheckins.length > 0) {
                                checkins = cloudCheckins;
                                localStorage.setItem(STORAGE_CHECKINS_KEY, JSON.stringify(checkins));
                                renderHistoryFeed();
                            }
                        }, (err) => {
                            console.error("Firestore snapshot error:", err);
                        });
                    }
                });

            } catch (err) {
                console.warn("Firebase failed to initialize, using local mode:", err);
                syncStatus.className = "inline-block w-2 h-2 rounded-full bg-gray-500";
                syncText.textContent = "Offline Mode";
            }
        }

        function loadLocalData() {
            const storedCheckins = localStorage.getItem(STORAGE_CHECKINS_KEY);
            const storedVenues = localStorage.getItem(STORAGE_VENUES_KEY);

            checkins = storedCheckins ? JSON.parse(storedCheckins) : [];
            venues = storedVenues ? JSON.parse(storedVenues) : DEFAULT_VENUES;
        }
        function populateFriends() {
            userSelect.innerHTML = friends.map(friend => 
                `<option value="${friend}">${friend}</option>`
            ).join('');
        }
        function populateVenues() {
            venueSelect.innerHTML = venues.map(venue => 
                `<option value="${venue.id}">${venue.name}</option>`
            ).join('');

            if (venues.length > 0) {
                onVenueChange(venues[0].id);
            }
        }

        function onVenueChange(venueId) {
            activeVenueId = venueId;
            const currentVenue = venues.find(v => v.id === venueId);
            if (!currentVenue) return;

            venueAddress.innerHTML = `<i class="fa-solid fa-location-dot text-untappd-accent"></i> ${currentVenue.address}`;
            venueDate.innerHTML = `<i class="fa-solid fa-calendar text-untappd-accent"></i> ${currentVenue.date}`;

            componentsContainer.innerHTML = currentVenue.components.map((comp, idx) => `
                <div class="bg-black/20 border border-untappd-border/50 rounded-xl p-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-sm font-bold text-white uppercase tracking-wide">${comp}</span>
                        <span id="compScore_${idx}" class="text-xs font-bold text-untappd-accent bg-black/60 px-2 py-0.5 rounded-md border border-untappd-border">3.00</span>
                    </div>
                    <input type="range" class="component-slider" data-index="${idx}" data-name="${comp}" min="1" max="5" step="0.25" value="3.0">
                </div>
            `).join('');

            document.querySelectorAll('.component-slider').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    const displayEl = document.getElementById(`compScore_${idx}`);
                    if (displayEl) {
                        displayEl.textContent = parseFloat(e.target.value).toFixed(2);
                    }
                });
            });
            selectedExtras.clear();
            extrasContainer.innerHTML = currentVenue.extras.map(extra => `
                <button type="button" data-extra="${extra}" class="extra-pill px-3 py-1.5 rounded-full text-xs font-medium border border-untappd-border bg-black/40 text-gray-300 hover:border-untappd-accent transition">
                    ${extra}
                </button>
            `).join('');

            document.querySelectorAll('.extra-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    const extraVal = pill.getAttribute('data-extra');
                    if (selectedExtras.has(extraVal)) {
                        selectedExtras.delete(extraVal);
                        pill.classList.remove('bg-untappd-accent', 'text-black', 'border-untappd-accent', 'font-bold');
                        pill.classList.add('bg-black/40', 'text-gray-300', 'border-untappd-border');
                    } else {
                        selectedExtras.add(extraVal);
                        pill.classList.add('bg-untappd-accent', 'text-black', 'border-untappd-accent', 'font-bold');
                        pill.classList.remove('bg-black/40', 'text-gray-300', 'border-untappd-border');
                    }
                });
            });
        }

        function setupEventListeners() {
            venueSelect.addEventListener('change', (e) => {
                onVenueChange(e.target.value);
            });

            overallScore.addEventListener('input', (e) => {
                overallScoreDisplay.textContent = parseFloat(e.target.value).toFixed(2);
            });

            cancelEditBtn.addEventListener('click', resetCheckinForm);
            checkinForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const editId = editingCheckinId.value;
                const userName = userSelect.value;
                const reviewNote = document.getElementById('reviewNote').value.trim();
                const overallVal = parseFloat(overallScore.value);

                const componentRatings = [];
                document.querySelectorAll('.component-slider').forEach(slider => {
                    componentRatings.push({
                        name: slider.getAttribute('data-name'),
                        score: parseFloat(slider.value)
                    });
                });

                const checkinData = {
                    venueId: activeVenueId,
                    userName: userName,
                    reviewNote: reviewNote,
                    overallScore: overallVal,
                    components: componentRatings,
                    extras: Array.from(selectedExtras),
                    timestamp: new Date().toISOString()
                };

                if (db && currentUser) {
                    try {
                        const { doc, setDoc, collection, addDoc, updateDoc } = window.firebaseModules;
                        if (editId) {
                            const checkinRef = doc(db, 'artifacts', appId, 'public', 'data', 'checkins', editId);
                            await updateDoc(checkinRef, checkinData);
                        } else {
                            const checkinsCol = collection(db, 'artifacts', appId, 'public', 'data', 'checkins');
                            await addDoc(checkinsCol, checkinData);
                        }
                    } catch (err) {
                        console.error("Firestore Save Error:", err);
                    }
                } else {
                    // FALLBACK AGAIN!!
                    if (editId) {
                        const idx = checkins.findIndex(c => c.id === editId);
                        if (idx !== -1) checkins[idx] = { id: editId, ...checkinData };
                    } else {
                        checkins.unshift({ id: 'ck_' + Date.now(), ...checkinData });
                    }
                    localStorage.setItem(STORAGE_CHECKINS_KEY, JSON.stringify(checkins));
                    renderHistoryFeed();
                }

                showNoticeModal(editId ? "Rating successfully updated!" : "Check-in saved!");
                resetCheckinForm();
            });

            document.getElementById('exportJsonBtn').addEventListener('click', exportDataJson);
            document.getElementById('closeModalBtn').addEventListener('click', hideNoticeModal);
        }

        function resetCheckinForm() {
            editingCheckinId.value = '';
            editingBanner.classList.add('hidden');
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Check-in`;
            checkinForm.reset();
            overallScore.value = 3.0;
            overallScoreDisplay.textContent = '3.00';
            if (venues.length > 0) onVenueChange(venueSelect.value);
        }

        window.editCheckin = function(id) {
            const item = checkins.find(c => c.id === id);
            if (!item) return;

            editingCheckinId.value = item.id;
            editingBanner.classList.remove('hidden');
            submitBtn.innerHTML = `<i class="fa-solid fa-pen"></i> Update Rating`;

            venueSelect.value = item.venueId;
            onVenueChange(item.venueId);

            userSelect.value = item.userName;
            document.getElementById('reviewNote').value = item.reviewNote || '';
            overallScore.value = item.overallScore;
            overallScoreDisplay.textContent = parseFloat(item.overallScore).toFixed(2);

            if (item.components) {
                item.components.forEach(c => {
                    const slider = document.querySelector(`.component-slider[data-name="${c.name}"]`);
                    if (slider) {
                        slider.value = c.score;
                        const idx = slider.getAttribute('data-index');
                        const display = document.getElementById(`compScore_${idx}`);
                        if (display) display.textContent = parseFloat(c.score).toFixed(2);
                    }
                });
            }

            if (item.extras) {
                item.extras.forEach(extra => {
                    const pill = document.querySelector(`.extra-pill[data-extra="${extra}"]`);
                    if (pill) pill.click();
                });
            }
            document.getElementById('btnTabCheckin').click();
        };

        window.deleteCheckin = async function(id) {
            if (!confirm("Are you sure you want to delete this rating?")) return;

            if (db && currentUser) {
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'checkins', id));
                } catch (err) {
                    console.error("Firestore Delete Error:", err);
                }
            } else {
                checkins = checkins.filter(c => c.id !== id);
                localStorage.setItem(STORAGE_CHECKINS_KEY, JSON.stringify(checkins));
                renderHistoryFeed();
            }
        };

        function setupTabNavigation() {
            const btnCheckin = document.getElementById('btnTabCheckin');
            const btnHistory = document.getElementById('btnTabHistory');
            const tabCheckin = document.getElementById('tab-checkin');
            const tabHistory = document.getElementById('tab-history');

            btnCheckin.addEventListener('click', () => {
                tabCheckin.classList.remove('hidden');
                tabHistory.classList.add('hidden');
                btnCheckin.className = "flex flex-col items-center text-untappd-accent transition group";
                btnHistory.className = "flex flex-col items-center text-untappd-textMuted hover:text-white transition group";
            });

            btnHistory.addEventListener('click', () => {
                tabHistory.classList.remove('hidden');
                tabCheckin.classList.add('hidden');
                btnHistory.className = "flex flex-col items-center text-untappd-accent transition group";
                btnCheckin.className = "flex flex-col items-center text-untappd-textMuted hover:text-white transition group";
            });
        }

        function renderHistoryFeed() {
            if (checkins.length === 0) {
                checkinCountBadge.textContent = "0 Check-ins";
                historyFeed.innerHTML = `
                    <div class="bg-untappd-card border border-untappd-border rounded-2xl p-8 text-center text-untappd-textMuted">
                        <i class="fa-solid fa-utensils text-3xl mb-2 text-untappd-accent/40"></i>
                        <p class="font-semibold text-white">No check-ins yet!</p>
                        <p class="text-xs mt-1">Be the first to rate a place with your friends.</p>
                    </div>
                `;
                return;
            }

            const grouped = {};
            checkins.forEach(ci => {
                if (!grouped[ci.venueId]) {
                    grouped[ci.venueId] = [];
                }
                grouped[ci.venueId].push(ci);
            });

            const uniqueVenueCount = Object.keys(grouped).length;
            checkinCountBadge.textContent = `${uniqueVenueCount} Venue${uniqueVenueCount === 1 ? '' : 's'} (${checkins.length} Ratings)`;

            historyFeed.innerHTML = Object.keys(grouped).map(venueId => {
                const venueCheckins = grouped[venueId];
                const venue = venues.find(v => v.id === venueId) || { name: 'Unknown Venue', address: '', date: '' };

                const totalScore = venueCheckins.reduce((acc, curr) => acc + (parseFloat(curr.overallScore) || 0), 0);
                const avgScore = (totalScore / venueCheckins.length).toFixed(2);

                return `
                    <div class="bg-untappd-card border border-untappd-border rounded-2xl overflow-hidden shadow-lg transition">
                        <!-- Venue Header Banner -->
                        <div class="p-4 bg-gradient-to-r from-untappd-card to-black/60 border-b border-untappd-border/80">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-extrabold text-lg text-white tracking-wide flex items-center gap-2">
                                        <i class="fa-solid fa-store text-untappd-accent text-sm"></i>
                                        ${venue.name}
                                    </h3>
                                    <div class="text-xs text-untappd-textMuted mt-1 space-y-0.5">
                                        <div class="flex items-center gap-1.5">
                                            <i class="fa-solid fa-location-dot text-untappd-accent text-[10px]"></i>
                                            <span>${venue.address}</span>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <i class="fa-solid fa-calendar text-untappd-accent text-[10px]"></i>
                                            <span>${venue.date}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="bg-untappd-accent text-black font-black px-3 py-1.5 rounded-xl text-base shadow-lg flex items-center gap-1 inline-flex">
                                        <i class="fa-solid fa-star text-xs"></i>
                                        <span>${avgScore}</span>
                                    </div>
                                    <div class="text-[10px] uppercase tracking-wider text-untappd-textMuted font-bold mt-1">
                                        Avg (${venueCheckins.length} ${venueCheckins.length === 1 ? 'review' : 'reviews'})
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Individual Friends Check-ins List -->
                        <div class="p-4 space-y-3 bg-black/20">
                            <div class="text-[11px] font-bold text-untappd-textMuted uppercase tracking-wider mb-2 flex items-center gap-1">
                                <i class="fa-solid fa-users text-untappd-accent"></i> Friends Ratings:
                            </div>
                            ${venueCheckins.map(item => {
                                const formattedDate = new Date(item.timestamp).toLocaleDateString(undefined, {
                                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                                });

                                return `
                                    <div class="bg-black/50 border border-untappd-border/60 rounded-xl p-3 space-y-2 relative group">
                                        <!-- Friend & Score Row -->
                                        <div class="flex justify-between items-center">
                                            <div class="flex items-center gap-2">
                                                <div class="w-7 h-7 rounded-full bg-untappd-accent/20 border border-untappd-accent/50 flex items-center justify-center text-untappd-accent font-bold text-xs">
                                                    ${item.userName.charAt(0)}
                                                </div>
                                                <div>
                                                    <span class="text-xs font-bold text-white">${item.userName}</span>
                                                    <span class="text-[10px] text-untappd-textMuted block">${formattedDate}</span>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button onclick="editCheckin('${item.id}')" title="Edit Rating" class="text-gray-400 hover:text-untappd-accent text-xs p-1">
                                                    <i class="fa-solid fa-pen"></i>
                                                </button>
                                                <button onclick="deleteCheckin('${item.id}')" title="Delete Rating" class="text-gray-400 hover:text-red-400 text-xs p-1">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                                <div class="bg-black/80 border border-untappd-accent/40 text-untappd-accent font-bold text-xs px-2.5 py-1 rounded-lg">
                                                    ★ ${parseFloat(item.overallScore).toFixed(2)}
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Review Note -->
                                        ${item.reviewNote ? `
                                            <p class="text-xs italic text-gray-300 bg-black/40 p-2.5 rounded-lg border border-untappd-border/40">
                                                "${item.reviewNote}"
                                            </p>
                                        ` : ''}

                                        <!-- Component Ratings -->
                                        ${item.components && item.components.length > 0 ? `
                                            <div class="grid grid-cols-2 gap-1.5 text-[11px] pt-1">
                                                ${item.components.map(c => `
                                                    <div class="bg-black/40 border border-untappd-border/40 rounded-lg p-1.5 flex justify-between items-center">
                                                        <span class="text-gray-400 font-medium truncate">${c.name}</span>
                                                        <span class="font-bold text-untappd-accent ml-1">${parseFloat(c.score).toFixed(2)}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : ''}

                                        <!-- Extras Ordered -->
                                        ${item.extras && item.extras.length > 0 ? `
                                            <div class="pt-1 flex flex-wrap gap-1 items-center">
                                                <span class="text-[9px] uppercase font-bold text-untappd-textMuted mr-1">Extras:</span>
                                                ${item.extras.map(ex => `
                                                    <span class="bg-untappd-accent/15 border border-untappd-accent/30 text-untappd-accent text-[9px] font-semibold px-2 py-0.5 rounded-full">
                                                        + ${ex}
                                                    </span>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // EXPORT
        function exportDataJson() {
            const payload = {
                venues: venues,
                checkins: checkins
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `places_export_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // MODAL HELPERS
        function showNoticeModal(msg) {
            const modal = document.getElementById('modalNotice');
            const modalBox = document.getElementById('modalBox');
            document.getElementById('modalMessage').textContent = msg;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-95');
            modalBox.classList.add('scale-100');
        }

        function hideNoticeModal() {
            const modal = document.getElementById('modalNotice');
            const modalBox = document.getElementById('modalBox');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
        }
    </script>
</body>
</html>
