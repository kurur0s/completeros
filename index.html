<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completeros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        untappd: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            border: '#2a2a2a',
                            accent: '#F36868',
                            accentDark: '#C11010',
                            textMuted: '#9e9e9e'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #121212;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            height: 8px;
            cursor: pointer;
            background: #333;
            border-radius: 9999px;
            border: 1px solid #444;
        }
        input[type=range]::-moz-range-track {
            height: 8px;
            cursor: pointer;
            background: #333;
            border-radius: 9999px;
            border: 1px solid #444;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            margin-top: -9px;
            border-radius: 50%;
            background: #F36868;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(246, 55, 106, 0.4);
        }
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #F36868;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(246, 55, 106, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-20 pt-2 px-2 sm:px-4">

    <header class="w-full max-w-md bg-untappd-card border border-untappd-border rounded-2xl p-4 mb-4 shadow-lg flex items-center justify-between sticky top-2 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-untappd-accent flex items-center justify-center text-black font-extrabold text-xl shadow-md">
                <i class="fa-solid fa-hotdog"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none text-white tracking-wide">Completeros</h1>
                <p class="text-xs text-untappd-textMuted mt-1 flex items-center gap-1">
                    <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-yellow-500"></span>
                    <span id="syncText">Contactando al más allá...</span>
                </p>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md flex-1">
        <!-- Registro -->
        <section id="tab-checkin" class="space-y-4">
            <div class="bg-untappd-card border border-untappd-border rounded-2xl p-4 shadow-md">
                <label class="text-xs uppercase tracking-wider text-untappd-textMuted font-semibold mb-1 block">Selecciona un local</label>
                <div class="relative">
                    <select id="venueSelect" class="w-full bg-black/50 border border-untappd-border text-white text-base rounded-xl p-3 appearance-none focus:outline-none focus:border-untappd-accent transition font-medium pr-10"></select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-untappd-accent">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-t border-untappd-border/60 flex justify-between items-center text-xs text-untappd-textMuted">
                    <span id="venueAddress" class="flex items-center gap-1"></span>
                    <span id="venueDate" class="flex items-center gap-1"></span>
                </div>
            </div>

            <form id="checkinForm" class="bg-untappd-card border border-untappd-border rounded-2xl p-5 shadow-lg space-y-5">
                <div>
                    <label class="text-xs uppercase tracking-wider text-untappd-textMuted font-semibold mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-user text-untappd-accent"></i> ¿Quién eres?
                    </label>
                    <div class="relative">
                        <select id="userSelect" required class="w-full bg-black/50 border border-untappd-border text-white text-base rounded-xl p-3 appearance-none focus:outline-none focus:border-untappd-accent transition font-semibold pr-10"></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-untappd-accent">
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="reviewNote" class="text-xs uppercase tracking-wider text-untappd-textMuted font-semibold mb-2 block">¿Qué tal estuvo?</label>
                    <textarea id="reviewNote" rows="2" maxlength="300" placeholder="Deja una reseña breve..." class="w-full bg-black/50 border border-untappd-border rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-untappd-accent transition resize-none"></textarea>
                </div>

                <div class="bg-black/30 border border-untappd-border/80 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-base font-extrabold text-white">COMPLENOTA</span>
                        <div class="bg-untappd-accent text-black font-black px-3 py-1 rounded-full text-sm flex items-center gap-1 shadow">
                            <i class="fa-solid fa-star text-xs"></i>
                            <span id="overallScoreDisplay">3.00</span>
                        </div>
                    </div>
                    <input type="range" id="overallScore" data-display="overallScoreDisplay" min="1" max="5" step="0.5" value="3">
                    <div class="flex justify-between text-[10px] text-untappd-textMuted mt-1 font-semibold px-1">
                        <span>1.0</span><span>2.0</span><span>3.0</span><span>4.0</span><span>5.0</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-xs uppercase tracking-wider text-untappd-textMuted font-semibold block border-b border-untappd-border/50 pb-1">Esenciales</label>
                    <div id="componentsContainer" class="space-y-4"></div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs uppercase tracking-wider text-untappd-textMuted font-semibold block">Agregados</label>
                    <div id="extrasContainer" class="flex flex-wrap gap-2 pt-1"></div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-untappd-accent hover:bg-untappd-accentDark active:scale-[0.99] disabled:opacity-50 text-black font-extrabold text-lg py-4 rounded-xl shadow-lg transition duration-150 flex items-center justify-center gap-2 uppercase tracking-wide">
                    <i class="fa-solid fa-circle-check"></i> Registrar
                </button>
            </form>
        </section>

        <!-- Locales -->
        <section id="tab-history" class="space-y-4 hidden">
            <div class="bg-untappd-card border border-untappd-border rounded-2xl p-3 flex justify-between items-center">
                <span class="text-xs text-untappd-textMuted font-semibold uppercase tracking-wider ml-1">Locales Visitados</span>
                <span id="checkinCountBadge" class="bg-black/60 border border-untappd-border text-untappd-accent text-xs font-bold px-2.5 py-1 rounded-full"></span>
            </div>
            <div id="historyFeed" class="space-y-4"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-untappd-card border-t border-untappd-border py-2 px-6 flex justify-around items-center max-w-md mx-auto z-50">
        <button id="btnTabCheckin" class="flex flex-col items-center text-untappd-accent transition">
            <i class="fa-solid fa-pen-to-square text-xl mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Registro</span>
        </button>
        <button id="btnTabHistory" class="flex flex-col items-center text-untappd-textMuted transition">
            <i class="fa-solid fa-list-check text-xl mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Locales</span>
        </button>
    </nav>

    <div id="modalNotice" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-untappd-card border border-untappd-accent/40 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl">
            <div class="w-14 h-14 bg-untappd-accent rounded-full flex items-center justify-center mx-auto mb-3 text-black text-2xl shadow-lg">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">¡Registro guardado!</h3>
            <p class="text-xs text-untappd-textMuted mb-4">Gracias por tu registro, Completero.</p>
            <button id="closeModalBtn" class="w-full bg-untappd-accent text-black font-bold py-2.5 rounded-xl text-sm hover:bg-untappd-accentDark transition">Genial!</button>
        </div>
    </div>

    <!-- Todo el código va en un solo bloque? incluido Firebase? -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // COMPLETEROS
        const FRIENDS = ["Josefina", "Lukas", "Marcela", "Ximena"];

        // Los locales se cargan desde un archivo JSON dentro del repositorio
        const VENUES_URL = "data/venues.json";
        let VENUES = [];

        async function loadVenues() {
            try {
                const res = await fetch(VENUES_URL);
                if (!res.ok) throw new Error("HTTP " + res.status);
                VENUES = await res.json();
                venueSelect.innerHTML = VENUES.map((v) => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
                showVenue();
                renderHistory();
            } catch (err) {
                console.error("No se pudieron cargar locales:", err);
                $("venueAddress").textContent = "No se pudo cargar la lista de locales.";
            }
        }

        //  FIREBASE  
        const firebaseConfig = {
            apiKey: "AIzaSyCLUkvi5DHcVjBNL7tzUgxKXF-s0Xks7g8",
            authDomain: "completeros.firebaseapp.com",
            projectId: "completeros",
            storageBucket: "completeros.firebasestorage.app",
            messagingSenderId: "1094417459923",
            appId: "1:1094417459923:web:01412cde5497b70b3a8226"
        };
        const db = getFirestore(initializeApp(firebaseConfig));
        const checkinsRef = collection(db, "checkins");

        //  ELEMENTOS  
        const $ = (id) => document.getElementById(id);
        const venueSelect = $("venueSelect");
        const userSelect = $("userSelect");
        const reviewNote = $("reviewNote");
        const overallScore = $("overallScore");
        const componentsContainer = $("componentsContainer");
        const extrasContainer = $("extrasContainer");
        const checkinForm = $("checkinForm");
        const submitBtn = $("submitBtn");

        let checkins = [];
        const selectedExtras = new Set();

        // Evita que un texto con símbolos raros rompa la página
        const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        // ESTADO DE CONEXIÓN  
        function setStatus(ok) {
            $("syncStatus").className = "inline-block w-2 h-2 rounded-full " + (ok ? "bg-green-500" : "bg-red-500");
            $("syncText").textContent = ok ? "Conectado" : "Sin comunicación con el mas allá";
        }

        onSnapshot(checkinsRef,
            (snapshot) => {
                checkins = snapshot.docs
                    .map((d) => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
                setStatus(true);
                renderHistory();
            },
            (err) => {
                console.error("Error de Firestore:", err);
                setStatus(false);
            }
        );
 
        userSelect.innerHTML = FRIENDS.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("");

        function showVenue() {
            const venue = VENUES.find((v) => v.id === venueSelect.value);
            $("venueAddress").innerHTML = `<i class="fa-solid fa-location-dot text-untappd-accent"></i> ${esc(venue.address)}`;
            $("venueDate").innerHTML = `<i class="fa-solid fa-calendar text-untappd-accent"></i> ${esc(venue.date)}`;

            componentsContainer.innerHTML = venue.components.map((name, i) => `
                <div class="bg-black/20 border border-untappd-border/50 rounded-xl p-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-sm font-bold text-white uppercase tracking-wide">${esc(name)}</span>
                        <span id="compScore_${i}" class="text-xs font-bold text-untappd-accent bg-black/60 px-2 py-0.5 rounded-md border border-untappd-border">3.00</span>
                    </div>
                    <input type="range" class="component-slider" data-name="${esc(name)}" data-display="compScore_${i}" min="1" max="5" step="0.5" value="3">
                </div>
            `).join("");

            selectedExtras.clear();
            extrasContainer.innerHTML = venue.extras.map((extra) => `
                <button type="button" data-extra="${esc(extra)}" class="extra-pill px-3 py-1.5 rounded-full text-xs font-medium border border-untappd-border bg-black/40 text-gray-300 transition">${esc(extra)}</button>
            `).join("");
        }

        function resetForm() {
            checkinForm.reset();
            overallScore.value = 3;
            $("overallScoreDisplay").textContent = "3.00";
            showVenue();
        }

        venueSelect.addEventListener("change", showVenue);

        checkinForm.addEventListener("input", (e) => {
            if (e.target.type !== "range") return;
            $(e.target.dataset.display).textContent = Number(e.target.value).toFixed(2);
            reviewNote.blur();
        });

        extrasContainer.addEventListener("click", (e) => {
            const pill = e.target.closest(".extra-pill");
            if (!pill) return;
            const extra = pill.dataset.extra;
            const on = !selectedExtras.has(extra);
            on ? selectedExtras.add(extra) : selectedExtras.delete(extra);
            pill.classList.toggle("bg-untappd-accent", on);
            pill.classList.toggle("text-black", on);
            pill.classList.toggle("border-untappd-accent", on);
            pill.classList.toggle("font-bold", on);
            pill.classList.toggle("bg-black/40", !on);
            pill.classList.toggle("text-gray-300", !on);
        });

        checkinForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;

            const components = [...document.querySelectorAll(".component-slider")].map((s) => ({
                name: s.dataset.name,
                score: Number(s.value)
            }));

            try {
                await addDoc(checkinsRef, {
                    venueId: venueSelect.value,
                    userName: userSelect.value,
                    reviewNote: reviewNote.value.trim(),
                    overallScore: Number(overallScore.value),
                    components,
                    extras: [...selectedExtras],
                    timestamp: new Date().toISOString()
                });
                resetForm();
                $("modalNotice").classList.remove("opacity-0", "pointer-events-none");
            } catch (err) {
                console.error("Error al guardar:", err);
                alert(":( algo malió sal");
            }
            submitBtn.disabled = false;
        });

        $("closeModalBtn").addEventListener("click", () => {
            $("modalNotice").classList.add("opacity-0", "pointer-events-none");
        });

        function showTab(tab) {
            const isCheckin = tab === "checkin";
            $("tab-checkin").classList.toggle("hidden", !isCheckin);
            $("tab-history").classList.toggle("hidden", isCheckin);
            $("btnTabCheckin").className = "flex flex-col items-center transition " + (isCheckin ? "text-untappd-accent" : "text-untappd-textMuted");
            $("btnTabHistory").className = "flex flex-col items-center transition " + (isCheckin ? "text-untappd-textMuted" : "text-untappd-accent");
        }
        $("btnTabCheckin").addEventListener("click", () => showTab("checkin"));
        $("btnTabHistory").addEventListener("click", () => showTab("history"));

        function renderHistory() {
            const feed = $("historyFeed");
            const badge = $("checkinCountBadge");
            if (VENUES.length === 0) return;

            if (checkins.length === 0) {
                badge.textContent = "0 locales visitados";
                feed.innerHTML = `
                    <div class="bg-untappd-card border border-untappd-border rounded-2xl p-8 text-center text-untappd-textMuted">
                        <i class="fa-solid fa-utensils text-3xl mb-2 text-untappd-accent/40"></i>
                        <p class="font-semibold text-white">¡Aún no hay registros!</p>
                        <p class="text-xs mt-1">Sé el primero en completar un registro.</p>
                    </div>`;
                return;
            }

            const grouped = {};
            checkins.forEach((c) => (grouped[c.venueId] ||= []).push(c));

            const venueCount = Object.keys(grouped).length;
            badge.textContent = `${venueCount} ${venueCount === 1 ? "local" : "locales"} (${checkins.length} notas)`;

            feed.innerHTML = Object.entries(grouped).map(([venueId, items]) => {
                const venue = VENUES.find((v) => v.id === venueId) || { name: "Local desconocido", address: "", date: "" };
                const avg = (items.reduce((sum, c) => sum + (Number(c.overallScore) || 0), 0) / items.length).toFixed(2);

                return `
                <div class="bg-untappd-card border border-untappd-border rounded-2xl overflow-hidden shadow-lg">
                    <div class="p-4 bg-gradient-to-r from-untappd-card to-black/60 border-b border-untappd-border/80 flex justify-between items-start">
                        <div>
                            <h3 class="font-extrabold text-lg text-white tracking-wide flex items-center gap-2">
                                <i class="fa-solid fa-store text-untappd-accent text-sm"></i> ${esc(venue.name)}
                            </h3>
                            <div class="text-xs text-untappd-textMuted mt-1 space-y-0.5">
                                <div><i class="fa-solid fa-location-dot text-untappd-accent text-[10px]"></i> ${esc(venue.address)}</div>
                                <div><i class="fa-solid fa-calendar text-untappd-accent text-[10px]"></i> ${esc(venue.date)}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="bg-untappd-accent text-black font-black px-3 py-1.5 rounded-xl text-base shadow-lg inline-flex items-center gap-1">
                                <i class="fa-solid fa-star text-xs"></i><span>${avg}</span>
                            </div>
                            <div class="text-[10px] uppercase tracking-wider text-untappd-textMuted font-bold mt-1">
                                Prom. (${items.length} ${items.length === 1 ? "nota" : "notas"})
                            </div>
                        </div>
                    </div>

                    <div class="p-4 space-y-3 bg-black/20">
                        ${items.map(renderCheckin).join("")}
                    </div>
                </div>`;
            }).join("");
        }

        function renderCheckin(item) {
            const date = new Date(item.timestamp).toLocaleDateString("es-CL", {
                month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
            });

            const note = item.reviewNote
                ? `<p class="text-xs italic text-gray-300 bg-black/40 p-2.5 rounded-lg border border-untappd-border/40">"${esc(item.reviewNote)}"</p>`
                : "";

            const components = (item.components || []).map((c) => `
                <div class="bg-black/40 border border-untappd-border/40 rounded-lg p-1.5 flex justify-between items-center">
                    <span class="text-gray-400 font-medium truncate">${esc(c.name)}</span>
                    <span class="font-bold text-untappd-accent ml-1">${Number(c.score).toFixed(2)}</span>
                </div>`).join("");

            const extras = (item.extras || []).map((x) => `
                <span class="bg-untappd-accent/15 border border-untappd-accent/30 text-untappd-accent text-[9px] font-semibold px-2 py-0.5 rounded-full">+ ${esc(x)}</span>`).join("");

            return `
            <div class="bg-black/50 border border-untappd-border/60 rounded-xl p-3 space-y-2">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-untappd-accent/20 border border-untappd-accent/50 flex items-center justify-center text-untappd-accent font-bold text-xs">${esc((item.userName || "?").charAt(0))}</div>
                        <div>
                            <span class="text-xs font-bold text-white">${esc(item.userName)}</span>
                            <span class="text-[10px] text-untappd-textMuted block">${date}</span>
                        </div>
                    </div>
                    <div class="bg-black/80 border border-untappd-accent/40 text-untappd-accent font-bold text-xs px-2.5 py-1 rounded-lg">★ ${Number(item.overallScore).toFixed(2)}</div>
                </div>
                ${note}
                ${components ? `<div class="grid grid-cols-2 gap-1.5 text-[11px] pt-1">${components}</div>` : ""}
                ${extras ? `<div class="pt-1 flex flex-wrap gap-1 items-center"><span class="text-[9px] uppercase font-bold text-untappd-textMuted mr-1">Agregados:</span>${extras}</div>` : ""}
            </div>`;
        }

        //  INICIO  
        loadVenues();
    </script>
</body>
</html>
